<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 400 650"
     width="400" height="650">

  <title>Lototi — Voiture vue de dessus</title>
  <desc>Illustration automobile vectorielle avec carrosserie
  galbée, vitrages, rétroviseurs et quatre sièges.</desc>

  <defs>
    <style>
      .body {
        fill: none;
        stroke: #171717;
        stroke-width: 3.5;
        stroke-linejoin: round;
        stroke-linecap: round;
      }
      .detail {
        fill: none;
        stroke: #292929;
        stroke-width: 2;
        stroke-linejoin: round;
        stroke-linecap: round;
      }
      .glass {
        fill: none;
        stroke: #292929;
        stroke-width: 2.5;
        stroke-linejoin: round;
      }
      .seat {
        fill: none;
        stroke: #292929;
        stroke-width: 2.4;
        stroke-linejoin: round;
        stroke-linecap: round;
      }
      .soft {
        fill: none;
        stroke: #777777;
        stroke-width: 1.3;
        stroke-linecap: round;
      }
    </style>
  </defs>

  <!-- Pneus et passages de roues -->
  <g class="body">
