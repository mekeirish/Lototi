    <path class="seam" d="M209 183 Q224 178 239 183 M207 251 Q224 247 241 251"/>
    <path class="seam" d="M224 188 V230 M223 256 V281"/>
    <path class="outline" d="M200 233 Q224 240 247 233 M195 282 Q223 289 250 282"/>
  </g>

  <!-- CONSOLE CENTRALE -->
  <g id="zone-console" class="zone" data-zone="console" data-label="Console centrale"
