    <path class="surface"
      d="M183 174 L217 174 L219 219 L215 236
         L185 236 L181 219 Z"
      style="--zone-color:#252b30"/>
    <rect x="188" y="182" width="24" height="13" rx="3"
      fill="#151a1e" stroke="#818a91" stroke-width="1.2"/>
    <path d="M193 205 L207 205 M193 211 L207 211"
      stroke="#8c969d" stroke-width="1.6" stroke-linecap="round"/>
    <rect x="190" y="218" width="20" height="10" rx="3"
      fill="#171c20" stroke="#626c73" stroke-width="1.2"/>
  </g>

  <!-- VITRES LATÉRALES -->
  <g id="zone-side-windows" class="zone" data-zone="side-windows" data-label="Vitres latérales"
     tabindex="0" role="button" aria-label="Vitres latérales">
    <path class="window"
      d="M91 184 L105 179 L105 276 L91 269 Z"/>
    <path class="window"
      d="M309 184 L295 179 L295 276 L309 269 Z"/>
    <path class="window"
      d="M91 306 L105 301 L105 393 L91 387 Z"/>
    <path class="window"
      d="M309 306 L295 301 L295 393 L309 387 Z"/>
  </g>

  <!-- PORTES GAUCHE ET DROITE -->
  <g id="zone-door-left" class="zone" data-zone="door-left" data-label="Porte gauche"
