    <path class="surface"
      d="M233 380 Q233 370 243 369 L279 369
         Q289 369 289 377 L288 404
         Q288 413 278 414 L244 414
         Q234 413 233 404 Z"/>
    <path class="seam" d="M244 332 Q261 328 278 332 M244 383 Q261 379 278 383"/>
    <path class="seam" d="M261 337 V360 M261 389 V402"/>
