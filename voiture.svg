      d="M104 535 Q200 558 296 535
         L279 573 Q265 594 246 596
         Q200 605 154 596
         Q135 594 121 573 Z"
      style="--zone-color:#aab2ba"/>
    <path class="outline" d="M121 573 Q200 591 279 573"/>
  </g>

  <!-- PARE-CHOCS ET ÉCLAIRAGES -->
  <g id="zone-lights" class="zone" data-zone="lights" data-label="Éclairages"
