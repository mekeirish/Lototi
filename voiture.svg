XML

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 620" role="img" aria-labelledby="title desc">
  <title id="title">Lototi — modèle vectoriel interactif d'une voiture</title>
  <desc id="desc">Vue de dessus avec sièges, carrosserie, vitres, portes, volant et console séparés.</desc>

  <defs>
    <linearGradient id="bodyPaint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e7eaed"/>
      <stop offset=".45" stop-color="#aab2ba"/>
      <stop offset="1" stop-color="#707982"/>
    </linearGradient>
    <linearGradient id="glassPaint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#314b5c"/>
      <stop offset="1" stop-color="#172631"/>
    </linearGradient>
    <style>
      .zone {
        cursor: pointer;
        transition: fill .18s ease, opacity .18s ease;
      }
      .zone:focus {
        outline: none;
        stroke: #ffd166;
        stroke-width: 4;
      }
      .surface {
        fill: var(--zone-color, #30363b);
        stroke: #111519;
        stroke-width: 2;
        stroke-linejoin: round;
      }
      .outline {
        fill: none;
        stroke: #242a2f;
        stroke-width: 2.4;
        stroke-linecap: round;
        stroke-linejoin: round;
        pointer-events: none;
      }
      .seam {
        fill: none;
        stroke: #aab1b6;
        stroke-width: 1.3;
        stroke-linecap: round;
        opacity: .72;
        pointer-events: none;
      }
      .detail {
        fill: none;
        stroke: #424a50;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
        pointer-events: none;
      }
      .window {
        fill: var(--zone-color, url(#glassPaint));
        stroke: #303b43;
        stroke-width: 2;
      }
      .highlight {
        fill: none;
        stroke: #f4f6f7;
        stroke-width: 1.5;
        opacity: .45;
        pointer-events: none;
      }
      .tire {
        fill: #15191c;
        stroke: #525a60;
        stroke-width: 2;
      }
      .wheel-rim {
        fill: #717a82;
        stroke: #20262b;
        stroke-width: 2;
      }
      .wheel-center {
        fill: #252c32;
        stroke: #aeb5ba;
        stroke-width: 1.4;
      }
      .lamp {
        fill: #f6e8c8;
        stroke: #6d7378;
        stroke-width: 1.5;
      }
      .rear-lamp {
        fill: #a33b40;
        stroke: #57252a;
        stroke-width: 1.5;
      }
    </style>
  </defs>

  <!-- CARROSSERIE : surface indépendante -->
  <g id="zone-body" class="zone" data-zone="body" data-label="Carrosserie"
     tabindex="0" role="button" aria-label="Carrosserie">
    <path class="surface" style="--zone-color:url(#bodyPaint)"
      d="M145 20
         Q200 4 255 20
         Q282 29 295 65
         L320 131
         Q331 159 331 197
         L331 431
         Q331 468 319 504
         L294 565
         Q281 598 255 605
         Q200 619 145 605
         Q119 598 106 565
         L81 504
         Q69 468 69 431
         L69 197
         Q69 159 80 131
         L105 65
         Q118 29 145 20 Z"/>
  </g>

  <!-- PNEUS ET JANTES -->
  <g id="zone-wheels" class="zone" data-zone="wheels" data-label="Roues"
     tabindex="0" role="button" aria-label="Roues">
    <g id="wheel-front-left" transform="translate(57 151)">
      <rect class="tire" x="0" y="0" width="28" height="76" rx="9"/>
      <rect class="wheel-rim" x="5" y="10" width="18" height="56" rx="6"/>
      <path class="detail" d="M14 17 V59 M8 38 H20"/>
    </g>
    <g id="wheel-front-right" transform="translate(315 151)">
      <rect class="tire" x="0" y="0" width="28" height="76" rx="9"/>
      <rect class="wheel-rim" x="5" y="10" width="18" height="56" rx="6"/>
      <path class="detail" d="M14 17 V59 M8 38 H20"/>
    </g>
    <g id="wheel-rear-left" transform="translate(57 406)">
      <rect class="tire" x="0" y="0" width="28" height="76" rx="9"/>
      <rect class="wheel-rim" x="5" y="10" width="18" height="56" rx="6"/>
      <path class="detail" d="M14 17 V59 M8 38 H20"/>
    </g>
    <g id="wheel-rear-right" transform="translate(315 406)">
      <rect class="tire" x="0" y="0" width="28" height="76" rx="9"/>
      <rect class="wheel-rim" x="5" y="10" width="18" height="56" rx="6"/>
      <path class="detail" d="M14 17 V59 M8 38 H20"/>
    </g>
  </g>

  <!-- VITRE AVANT -->
  <g id="zone-windshield" class="zone" data-zone="windshield" data-label="Pare-brise"
     tabindex="0" role="button" aria-label="Pare-brise">
    <path class="window"
      d="M124 58 Q200 30 276 58
         L300 125 Q301 136 287 139
         L113 139 Q99 136 100 125 Z"/>
    <path class="highlight" d="M123 65 Q200 42 277 65"/>
  </g>

  <!-- TABLEAU DE BORD -->
  <g id="zone-dashboard" class="zone" data-zone="dashboard" data-label="Tableau de bord"
     tabindex="0" role="button" aria-label="Tableau de bord">
    <path class="surface"
      d="M95 143 Q200 130 305 143
         L311 169 Q200 181 89 169 Z"
      style="--zone-color:#343b41"/>
    <path class="outline" d="M95 143 Q200 130 305 143"/>
    <rect x="170" y="145" width="60" height="15" rx="4"
      fill="#161d22" stroke="#6e7981" stroke-width="1.5"/>
    <circle cx="111" cy="155" r="5" fill="#1a2025" stroke="#7e888f"/>
    <circle cx="289" cy="155" r="5" fill="#1a2025" stroke="#7e888f"/>
  </g>

  <!-- VOLANT -->
  <g id="zone-steering" class="zone" data-zone="steering" data-label="Volant"
     tabindex="0" role="button" aria-label="Volant">
    <circle cx="128" cy="181" r="20" fill="none"
      stroke="var(--zone-color, #151a1e)" stroke-width="7"/>
    <circle cx="128" cy="181" r="7" fill="var(--zone-color, #151a1e)"
      stroke="#8e979e" stroke-width="1.3"/>
    <path d="M128 174 V164 M122 184 L113 193 M134 184 L143 193"
      fill="none" stroke="#8e979e" stroke-width="2"/>
  </g>

  <!-- SIÈGE AVANT GAUCHE : CONDUCTEUR -->
  <g id="seat-front-left" class="zone" data-zone="seat-front-left"
     data-label="Siège conducteur" tabindex="0" role="button"
     aria-label="Siège conducteur">
    <path class="surface"
      d="M153 178 Q153 170 163 170
         L190 170 Q200 171 200 182
         L200 233 Q199 245 188 248
         L164 248 Q153 245 153 233 Z"/>
    <path class="surface"
      d="M151 245 Q151 237 161 237
         L192 237 Q203 238 203 249
         L205 282 Q204 293 193 295
         L161 295 Q150 293 150 282 Z"/>
    <path class="seam" d="M161 183 Q176 178 191 183 M161 251 Q176 247 193 251"/>
    <path class="seam" d="M176 188 V230 M176 256 V281"/>
