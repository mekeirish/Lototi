    <path class="lamp" d="M289 43 Q270 29 250 27 L257 41 L281 50 Z"/>
    <path class="rear-lamp" d="M105 548 L123 557 L128 570 L115 563 Z"/>
    <path class="rear-lamp" d="M295 548 L277 557 L272 570 L285 563 Z"/>
  </g>

  <!-- RÉTROVISEURS -->
  <g id="zone-mirrors" class="zone" data-zone="mirrors" data-label="Rétroviseurs"
