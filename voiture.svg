    <path class="surface"
      d="M167 380 Q167 370 177 369 L223 369
         Q233 370 233 380 L233 404
         Q232 413 222 414 L178 414
         Q168 413 167 404 Z"/>
    <path class="seam" d="M177 332 Q200 328 223 332 M178 383 Q200 379 222 383"/>
    <path class="seam" d="M200 337 V360 M200 389 V402"/>
  </g>

  <!-- BANQUETTE ARRIÈRE DROITE -->
