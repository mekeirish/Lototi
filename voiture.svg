         L273 526 Q200 550 127 526 Z"/>
    <path class="highlight" d="M124 463 Q200 480 276 463"/>
  </g>

  <!-- COFFRE -->
  <g id="zone-trunk" class="zone" data-zone="trunk" data-label="Coffre"
